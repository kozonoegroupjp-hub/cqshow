<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1766aa"><meta name="apple-mobile-web-app-capable" content="yes">
  <title>CQShow — 見積書・請求書</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <div id="toast" aria-live="polite"></div>
  <section id="auth-view" class="auth-wrap">
    <div class="auth-card">
      <div class="brand-mark">CQ</div><h1>CQShow</h1><p class="jp">見積書・請求書</p>
      <p class="sub">Orçamentos e faturas para empresas que trabalham entre o Brasil e o Japão.</p>
      <form id="auth-form">
        <label>E-mail<input id="auth-email" type="email" autocomplete="email" required placeholder="seu@email.com"></label>
        <label>Senha<input id="auth-password" type="password" autocomplete="current-password" minlength="8" required placeholder="Mínimo de 8 caracteres"></label>
        <button class="primary" type="submit">Entrar</button>
      </form>
      <button id="register-btn" class="link-button">Criar acesso novo</button>
      <p id="auth-hint" class="hint"></p>
    </div>
  </section>
  <section id="app-view" hidden>
    <header class="topbar"><div><strong>CQShow</strong><small>見積書・請求書</small></div><div class="head-actions"><span id="company-label"></span><button id="signout-btn" class="icon-btn" title="Sair">↪</button></div></header>
    <main id="main" class="content"></main>
    <nav class="bottom-nav" aria-label="Navegação principal">
      <button data-view="home"><span>⌂</span>Início</button><button data-view="documents"><span>▤</span>Documentos</button><button data-view="clients"><span>♙</span>Clientes</button><button data-view="services"><span>⌘</span>Serviços</button><button data-view="settings"><span>⚙</span>Ajustes</button>
    </nav>
  </section>
  <script src="config.js"></script><script type="module" src="app.js?v=6"></script>
  <style>@media(max-width:620px){.table th:nth-child(3),.table td:nth-child(3){display:table-cell}.table td.actions{display:flex;justify-content:flex-end;gap:5px;flex-wrap:wrap}.table button{margin-left:0;padding:8px 9px;font-size:12px}}</style>

</body></html>
