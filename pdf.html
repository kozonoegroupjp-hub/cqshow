<!doctype html><html lang="ja"><meta charset="utf-8"><title>CQShow PDF</title><style>@page{size:A4;margin:13mm}*{box-sizing:border-box}body{font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN',Arial,sans-serif;color:#1a1a1a;font-size:10pt}.loading{padding:40px;text-align:center;color:#1766aa}.top{display:grid;grid-template-columns:1.1fr .9fr;border-bottom:3px solid #2c77b5;padding-bottom:11px}.company{font-size:16pt;font-weight:800;color:#1766aa;white-space:nowrap}.title{text-align:right;font-size:25pt;font-weight:800;color:#1766aa}.meta{text-align:right;line-height:1.7}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:23px 0}.box{border-top:5px solid #2c77b5;padding:9px 2px;line-height:1.7}.label{color:#1766aa;font-weight:bold}table{border-collapse:collapse;width:100%;margin-top:15px}th{background:#2c77b5;color:#fff;padding:8px;text-align:left}td{border:1px solid #a9b5c0;padding:8px;vertical-align:top}td:nth-child(1),td:nth-child(3){text-align:center}td:nth-child(n+4){text-align:right}tbody tr{height:12mm}.sum{width:42%;margin:18px 0 0 auto}.sum td{padding:6px}.sum td:first-child{background:#dcecf8;font-weight:bold}.sum tr:last-child td{font-size:14pt;font-weight:bold;background:#c4dff3}.note{margin-top:20px;white-space:pre-line}.bank{border-top:1px solid #9aaab7;margin-top:24px;padding-top:10px;white-space:pre-line;line-height:1.6}.footer{margin-top:28px;color:#6b7783;font-size:8pt;text-align:center}</style><body><div class="loading">Gerando documento…</div><script>const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const M=n=>new Intl.NumberFormat('ja-JP',{style:'currency',currency:'JPY',maximumFractionDigits:0}).format(Number(n||0));const D=v=>v?new Date(v+'T00:00:00').toLocaleDateString('ja-JP'):'';addEventListener('message',e=>{if(e.origin!==location.origin||e.data?.type!=='cqshow-pdf')return;const {d,c,items,t,o}=e.data.payload,title=d.document_type==='quote'?'見積書':'請求書';const filled=[...items];while(filled.length<5)filled.push({description:'',quantity:'',unit_price:'',discount:'',tax_rate:0});const rows=filled.map((i,n)=>`<tr><td>${n+1}</td><td>${E(i.description)}</td><td>${i.quantity}</td><td>${M(i.unit_price)}</td><td>${M(i.discount)}</td><td>${M((i.quantity*i.unit_price-i.discount)*(1+i.tax_rate/100))}</td></tr>`).join('');document.body.innerHTML=`<div class="top"><div><div class="company">${E(o.name)}</div><div>${E(o.address)}<br>法人番号：${E(o.corporate_number)}<br>TEL：${E(o.phone)}<br>E-mail：${E(o.email)}</div></div><div><div class="title">${title}</div><div class="meta">番号：${E(d.document_number)}<br>日付：${D(d.issue_date)}</div></div></div><div class="grid"><div class="box"><span class="label">${d.document_type==='quote'?'お見積先':'請求先'}</span><br><b style="font-size:14pt">${E(c.name)}</b><br>${E(c.address)}<br>${E(c.phone)}　${E(c.email)}</div><div class="box"><span class="label">${d.document_type==='quote'?'見積金額':'ご請求金額'}</span><br><b style="font-size:22pt;color:#1766aa">${M(t.total)}</b>${d.due_date?`<br>お支払期限：${D(d.due_date)}`:''}</div></div><table><thead><tr><th>No.</th><th>内容</th><th>数量</th><th>単価</th><th>値引</th><th>金額（税込）</th></tr></thead><tbody>${rows}</tbody></table><table class="sum"><tr><td>小計</td><td>${M(t.sub)}</td></tr><tr><td>消費税</td><td>${M(t.tax)}</td></tr><tr><td>合計（税込）</td><td>${M(t.total)}</td></tr></table>${d.notes?`<div class="note"><b>備考</b><br>${E(d.notes)}</div>`:''}<div class="bank"><b>振込先</b><br>${E(o.bank_details)}</div><div class="footer">${E(o.name)}　${title}</div>`;setTimeout(()=>print(),250)});</script></body></html>
