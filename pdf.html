<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<title>CQShow PDF</title>
<style>@page{size:A4;margin:8mm}*{box-sizing:border-box}body{font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN',Arial,sans-serif;color:#222;font-size:9pt}.loading{padding:40px;text-align:center;color:#286090}.sheet{min-height:281mm}.header{display:grid;grid-template-columns:1fr 84mm;align-items:start;border-bottom:1px solid #5a89b2;padding:1mm 0 2mm}.header>div:first-child{min-width:0}.company{font-size:13pt;font-weight:800;letter-spacing:0;color:#214f78;white-space:nowrap}.company-info{margin-top:1mm;line-height:1.3;font-size:7.5pt}.title{font-size:24pt;line-height:1;font-weight:800;letter-spacing:2px;color:#214f78;text-align:right}.meta{margin:2mm 0 0 auto;border-collapse:collapse;font-size:8pt}.meta th,.meta td{border:1px solid #95afc5;padding:1mm 2mm}.meta th{background:#dcebf7;color:#214f78;text-align:left;white-space:nowrap}.meta td{min-width:40mm}.to-row{display:grid;grid-template-columns:1fr 69mm;gap:6mm;margin:5mm 0 4mm}.client{border-bottom:1px solid #7897b0;padding:1mm 0 2mm;line-height:1.35}.client-label{font-size:8pt;color:#555}.client-name{font-size:13pt;font-weight:700}.amount-box{border:1px solid #95afc5;text-align:center}.amount-box .label{padding:1mm;background:#dcebf7;color:#214f78;font-weight:700}.amount-box .value{padding:2mm;font-size:16pt;font-weight:800;color:#214f78}table{width:100%;border-collapse:collapse}.items th{background:#4f80aa;color:#fff;border:1px solid #4f80aa;padding:1.2mm;font-size:8pt}.items td{border:1px solid #aabcc9;padding:1mm;height:6.5mm}.items th:first-child{width:58%}.items th:nth-child(2),.items th:nth-child(3),.items th:nth-child(4){width:14%}.qty{text-align:center}.price,.yen{text-align:right}.bottom-row{display:grid;grid-template-columns:1fr 43%;gap:6mm;align-items:end;margin-top:2mm}.summary{width:100%;margin:0}.summary td{border:1px solid #aabcc9;padding:1.2mm 2mm}.summary td:first-child{background:#edf4f9;font-weight:700}.summary td:last-child{text-align:right}.summary .total td{background:#dcebf7;color:#214f78;font-size:11pt;font-weight:800}.notes,.bank{margin-top:2mm;border-top:1px solid #95afc5;padding-top:1mm;line-height:1.25;white-space:pre-line;font-size:8pt}.thanks{margin:0;padding-bottom:2mm;text-align:left;color:#555;font-size:8pt}.footer{display:none}</style>
<body><div class="loading">Gerando documento…</div><script>
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const M=n=>new Intl.NumberFormat('ja-JP',{style:'currency',currency:'JPY',maximumFractionDigits:0}).format(Number(n||0));
const D=v=>v?new Date(v+'T00:00:00').toLocaleDateString('ja-JP'):'';
addEventListener('message',e=>{if(e.origin!==location.origin||e.data?.type!=='cqshow-pdf')return;const {d,c,items,t,o}=e.data.payload;const isQuote=d.document_type==='quote';const title=isQuote?'見積書':'請求書';const filled=[...items];while(filled.length<10)filled.push({description:'',quantity:'',unit_price:'',discount:0,tax_rate:0});const rows=filled.map(i=>{const amount=(+i.quantity||0)*(+i.unit_price||0)-(+i.discount||0);return '<tr><td>'+E(i.description)+'</td><td class="qty">'+(i.quantity||'')+'</td><td class="price">'+(i.unit_price===''?'':M(i.unit_price))+'</td><td class="yen">'+(i.description?M(amount*(1+(+i.tax_rate||0)/100)):'')+'</td></tr>'}).join('');const address=[c.address,c.phone,c.email].filter(Boolean).map(E).join('<br>');document.body.innerHTML='<main class="sheet"><header class="header"><div><div class="company">'+E(o.name)+'</div><div class="company-info">'+E(o.address)+'<br>法人番号：'+E(o.corporate_number)+'<br>TEL：'+E(o.phone)+'　E-mail：'+E(o.email)+'</div></div><div><div class="title">'+title+'</div><table class="meta"><tr><th>'+title+'番号</th><td>'+E(d.document_number)+'</td></tr><tr><th>発行日</th><td>'+D(d.issue_date)+'</td></tr></table></div></header><section class="to-row"><div class="client"><div class="client-label">'+(isQuote?'御見積先':'御請求先')+'</div><div class="client-name">'+E(c.name)+'　御中</div><div>'+address+'</div></div><div class="amount-box"><div class="label">'+(isQuote?'御見積金額':'御請求金額')+'</div><div class="value">'+M(t.total)+'</div></div></section><table class="items"><thead><tr><th>内容</th><th>数量</th><th>単価</th><th>金額（税込）</th></tr></thead><tbody>'+rows+'</tbody></table><section class="bottom-row"><div class="thanks">ご利用ありがとうございます。</div><table class="summary"><tr><td>小計</td><td>'+M(t.sub)+'</td></tr><tr><td>消費税</td><td>'+M(t.tax)+'</td></tr><tr class="total"><td>合計（税込）</td><td>'+M(t.total)+'</td></tr></table></section>'+(d.notes?'<section class="notes"><b>備考</b><br>'+E(d.notes)+'</section>':'')+(o.bank_details?'<section class="bank"><b>振込先</b><br>'+E(o.bank_details)+'</section>':'')+'</main>';const brand=document.querySelector('.company');let size=13;while(brand.scrollWidth>brand.parentElement.clientWidth&&size>8){brand.style.fontSize=--size+'pt'};setTimeout(()=>print(),250)});
</script></body></html>
